name: Thu thap du lieu dien nang moi gio

on:
  schedule:
    # Chạy vào phút thứ 5 mỗi giờ, giờ UTC.
    # Giờ Việt Nam = UTC + 7, nên "5 * * * *" tương đương chạy vào phút 05
    # của mỗi giờ Việt Nam (ví dụ 08:05, 09:05, 10:05...).
    - cron: "5 * * * *"
  workflow_dispatch: {}   # cho phép bấm chạy tay để test (tab Actions -> Run workflow)

permissions:
  contents: write   # cần quyền này để workflow commit file CSV ngược lại vào repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai dat Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: pip install requests

      - name: Chay script lay du lieu
        env:
          EOH_TOKEN: ${{ secrets.EOH_TOKEN }}
        run: python era_collector_once.py

      - name: Luu ket qua vao repo (commit file CSV)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add era_energy.csv
          git diff --staged --quiet && echo "Khong co thay doi, bo qua commit" || git commit -m "Cap nhat du lieu dien nang $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
